<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskFlow</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="logo">Task<span>Flow</span></h1>

    <div class="header-controls">
      <label class="search">
        <span class="visually-hidden">Search tickets</span>
        <input id="search" type="search" placeholder="Search tickets" autocomplete="off" />
      </label>

      <label class="filter">
        <span class="visually-hidden">Filter by priority</span>
        <select id="filter-priority">
          <option value="">All priorities</option>
          <option value="critical">Critical</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </label>

      <label class="filter">
        <span class="visually-hidden">Filter by assignee</span>
        <select id="filter-assignee">
          <option value="">All assignees</option>
        </select>
      </label>

      <button id="clear-filters" type="button" class="btn btn-ghost">Clear filters</button>
      <button id="new-ticket" type="button" class="btn btn-primary">New ticket</button>
    </div>
  </header>

  <p class="result-summary" id="result-summary" data-testid="result-summary" role="status" aria-live="polite"></p>

  <main id="board" class="board" aria-label="Ticket board"></main>

  <dialog id="ticket-dialog" class="dialog" aria-labelledby="dialog-title">
    <form id="ticket-form" method="dialog" novalidate>
      <h2 id="dialog-title">New ticket</h2>

      <div class="field">
        <label for="title">Title</label>
        <input id="title" name="title" type="text" autocomplete="off" />
        <p class="error" id="title-error" data-testid="title-error" hidden></p>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status"></select>
        </div>

        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="assignee">Assignee</label>
        <input id="assignee" name="assignee" type="text" autocomplete="off" list="assignee-options" />
        <datalist id="assignee-options"></datalist>
        <p class="error" id="assignee-error" data-testid="assignee-error" hidden></p>
      </div>

      <footer class="dialog-actions">
        <button type="button" id="cancel-ticket" class="btn btn-ghost">Cancel</button>
        <button type="submit" id="save-ticket" class="btn btn-primary">Save ticket</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" class="toast" data-testid="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
